<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>

<div class="main-wrapper">

    <!-- Left side (branding) -->
    <div class="auth-left">
        <h1>Inventory System</h1>
        <p>Manage your stock with the stocks being stocked in the stocks.</p>
    </div>

    <!-- Right side (form) -->
    <div class="auth-right">
        <h2>Forgot Password?</h2>

        <p>Enter your username and choose a new password.</p>

        <form id="forgotPasswordForm">

            <label for="username">Username</label>
            <input type="text" id="username" required>

            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required>

            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" required>

            <button type="submit" class="action-btn">Reset Password</button>

            <p id="message"></p>

            <p class="auth-link">
                Remember your password? <a href="login.html">Back to Login</a>
            </p>

        </form>
    </div>

</div>

<script type="module" src="js/forgot-password.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
