<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adjust Stock</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/items.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-logo">InventoryHub</div>

    <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="icon">🏠</i><span>Dashboard</span></a></li>
        <li><a href="items.html"><i class="icon">📦</i><span>Items</span></a></li>
        <li><a href="#"><i class="icon">📊</i><span>Reports</span></a></li>
        <li><a href="#"><i class="icon">🏭</i><span>Warehouse</span></a></li>
        <li><a href="#"><i class="icon">🧾</i><span>Purchase Orders</span></a></li>
        <li><a href="#"><i class="icon">⚙️</i><span>Settings</span></a></li>
    </ul>

    <div class="sidebar-footer">
        <button id="themeToggle">🌙 Theme</button>
        <a href="login.html" class="exit-btn">Exit</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <h1>Adjust Stock</h1>

    <form id="adjustStockForm" class="item-form">

        <label>Select Item</label>
        <select id="stockItemSelect" required></select>

        <label>Adjustment Type</label>
        <select id="adjustType" required>
            <option value="increase">Increase Stock</option>
            <option value="decrease">Decrease Stock</option>
        </select>

        <label>Amount</label>
        <input type="number" id="adjustAmount" required>

        <button type="submit" class="action-btn">Apply Adjustment</button>

    </form>

</div>

<script src="js/theme.js"></script>
<script src="js/api.js" type="module"></script>
<script src="js/adjust-stock.js" type="module"></script>

</body>
</html>
