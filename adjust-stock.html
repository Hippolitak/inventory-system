<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adjust Stock</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-logo">InventoryHub</div>

    <ul class="sidebar-menu">
        <li><a href="dashboard.html"><span>🏠 Dashboard</span></a></li>
        <li><a href="items.html"><span>📦 Items</span></a></li>
        <li><a href="#"><span>📊 Reports</span></a></li>
        <li><a href="#"><span>🏭 Warehouse</span></a></li>
        <li><a href="#"><span>🧾 Purchase Orders</span></a></li>
        <li><a href="#"><span>⚙️ Settings</span></a></li>
    </ul>

    <div class="sidebar-footer">
        <button id="themeToggle" class="action-btn">Theme</button>
        <a href="login.html" class="exit-btn">Exit</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <h1>Adjust Stock</h1>

    <form id="adjustStockForm" class="form-section">

        <label for="stockItemSelect">Select Item</label>
        <select id="stockItemSelect" required></select>

        <label for="adjustType">Adjustment Type</label>
        <select id="adjustType" required>
            <option value="increase">Increase Stock</option>
            <option value="decrease">Decrease Stock</option>
        </select>

        <label for="adjustAmount">Amount</label>
        <input type="number" id="adjustAmount" required>

        <button type="submit" class="action-btn">Apply Adjustment</button>

    </form>

</div>

<script src="js/api.js" type="module"></script>
<script src="js/adjust-stock.js" type="module"></script>
<script src="js/theme.js"></script>

</body>
</html>
