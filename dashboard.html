<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-logo">InventoryHub</div>

    <ul class="sidebar-menu">
        <li><a href="dashboard.html"><span>🏠 Dashboard</span></a></li>
        <li><a href="items.html"><span>📦 Items</span></a></li>
        <li><a href="reports.html"><span>📊 Reports</span></a></li>
        <li><a href="#"><span>⚙️ Settings</span></a></li>
    </ul>

    <div class="sidebar-footer">
        <button id="themeToggle" class="action-btn">Theme</button>
        <a href="login.html" class="exit-btn">Logout</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- Greeting -->
    <h1 id="greeting">Welcome back, User</h1>

    <!-- Stat Cards -->
    <div class="stats-container">

        <div class="stat-card item-card">
            <h3>Total Items</h3>
            <p id="totalItems">0</p>
        </div>

        <div class="stat-card item-card">
            <h3>Total Quantity</h3>
            <p id="totalQuantity">0</p>
        </div>

        <div class="stat-card item-card">
            <h3>Inventory Value</h3>
            <p id="inventoryValue">£0.00</p>
        </div>

        <div class="stat-card item-card">
            <h3>Low Stock</h3>
            <p id="lowStock">0</p>
        </div>

        <div class="stat-card item-card">
            <h3>Out of Stock</h3>
            <p id="outOfStock">0</p>
        </div>

    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <a href="add-item.html" class="action-btn">Add Item</a>
        <a href="adjust-stock.html" class="action-btn">Adjust Stock</a>
    </div>

    <!-- Recent Items -->
    <h2>Recent Inventory</h2>
    <div id="recentItems" class="recent-items"></div>

</div>

<script src="js/api.js" type="module"></script>
<script src="js/dashboard.js" type="module"></script>
<script src="js/theme.js"></script>

</body>
</html>
