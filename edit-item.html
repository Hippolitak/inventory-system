<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Item</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-logo">InventoryHub</div>

    <ul class="sidebar-menu">
        <li><a href="dashboard.html"><span>🏠 Dashboard</span></a></li>
        <li><a href="items.html"><span>📦 Items</span></a></li>
        <li><a href="#"><span>📊 Reports</span></a></li>
        <li><a href="#"><span>⚙️ Settings</span></a></li>
    </ul>

    <div class="sidebar-footer">
        <button id="themeToggle" class="action-btn">Theme</button>
        <a href="login.html" class="exit-btn">Logout</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <h1>Edit Item</h1>

    <form id="editItemForm" class="form-section">

        <label for="editName">Item Name</label>
        <input type="text" id="editName" required>

        <label for="editCode">Item Code</label>
        <input type="text" id="editCode" required>

        <label for="editCategory">Category</label>
        <input type="text" id="editCategory" placeholder="e.g. Laptop, Shower, Window" required>

        <label for="editQuantity">Quantity</label>
        <input type="number" id="editQuantity" required>

        <label for="editPrice">Price (£)</label>
        <input type="number" id="editPrice" step="0.01" required>

        <label for="editImage">Replace Image</label>
        <input type="file" id="editImage" accept="image/*">

        <button type="submit" class="action-btn">Save Changes</button>

    </form>

</div>

<script src="js/api.js" type="module"></script>
<script src="js/edit-item.js" type="module"></script>
<script src="js/theme.js"></script>

</body>
</html>
