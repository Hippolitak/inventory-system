<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Item</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-logo">InventoryHub</div>

    <ul class="sidebar-menu">
        <li><a href="dashboard.html"><span>🏠 Dashboard</span></a></li>
        <li><a href="items.html"><span>📦 Items</span></a></li>
        <li><a href="#"><span>📊 Reports</span></a></li>
        <li><a href="#"><span>⚙️ Settings</span></a></li>
    </ul>

    <div class="sidebar-footer">
        <button id="themeToggle" class="action-btn">Theme</button>
        <a href="login.html" class="exit-btn">Logout</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <h1>Add New Item</h1>

    <form id="addItemForm" class="form-section">

        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" required>

        <label for="itemCode">Item Code</label>
        <input type="text" id="itemCode" required>

        <label for="itemCategory">Category</label>
        <select id="itemCategory" required>
            <option value="laptop">Laptop</option>
            <option value="monitor">Monitor</option>
            <option value="accessory">Accessory</option>
            <option value="box">General Item</option>
        </select>

        <label for="itemQuantity">Quantity</label>
        <input type="number" id="itemQuantity" required>

        <label for="itemPrice">Price (£)</label>
        <input type="number" id="itemPrice" step="0.01" required>

        <label for="itemImage">Upload Image (free will)</label>
        <input type="file" id="itemImage" accept="image/*">

        <button type="submit" class="action-btn">Save Item</button>

    </form>

</div>

<script src="js/api.js" type="module"></script>
<script src="js/items.js" type="module"></script>
<script src="js/theme.js"></script>

</body>
</html>
