<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Item</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/items.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-logo">InventoryHub</div>

    <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="icon">🏠</i><span>Dashboard</span></a></li>
        <li><a href="items.html"><i class="icon">📦</i><span>Items</span></a></li>
        <li><a href="#"><i class="icon">📊</i><span>Reports</span></a></li>
        <li><a href="#"><i class="icon">🏭</i><span>Warehouse</span></a></li>
        <li><a href="#"><i class="icon">🧾</i><span>Purchase Orders</span></a></li>
        <li><a href="#"><i class="icon">⚙️</i><span>Settings</span></a></li>
    </ul>

    <div class="sidebar-footer">
        <button id="themeToggle">🌙 Theme</button>
        <a href="login.html" class="exit-btn">Exit</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <h1>Add New Item</h1>

    <form id="addItemForm" class="item-form">

        <label>Item Name</label>
        <input type="text" id="itemName" required>

        <label>Item Code</label>
        <input type="text" id="itemCode" required>

        <label>Category</label>
        <select id="itemCategory" required>
            <option value="laptop">Laptop</option>
            <option value="monitor">Monitor</option>
            <option value="accessory">Accessory</option>
            <option value="box">General Item</option>
        </select>

        <label>Quantity</label>
        <input type="number" id="itemQuantity" required>

        <label>Price (£)</label>
        <input type="number" id="itemPrice" step="0.01" required>

        <label>Upload Image (optional)</label>
        <input type="file" id="itemImage" accept="image/*">

        <button type="submit" class="action-btn">Save Item</button>

    </form>

</div>

<script src="js/api.js" type="module"></script>
<script src="js/items.js" type="module"></script>
<script src="js/theme.js"></script>

</body>
</html>
